<nav class="navbar">
  <a class="brand" routerLink="/doctors">ClinicApp</a>

  <div class="nav-links">
    @if (authService.isLoggedIn()) {
    <a routerLink="/doctors">Doctors</a>
    <a routerLink="/dashboard">My Appointments</a>
    <span class="patient-name">
      Hi, {{ authService.currentPatient()?.first_name }}
    </span>
    <button class="btn-logout" (click)="authService.logout()">
      Logout
    </button>
    } @else {
    <a routerLink="/login">Login</a>
    <a routerLink="/register">Register</a>
    }
  </div>
</nav>

<router-outlet />
