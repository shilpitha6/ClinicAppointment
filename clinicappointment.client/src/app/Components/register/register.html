<div class="auth-container">
  <div class="auth-card">
    <h2>Create Account</h2>

    <div class="form-row">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" [(ngModel)]="form.first_name" placeholder="First name" />
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" [(ngModel)]="form.last_name" placeholder="Last name" />
      </div>
    </div>

    <div class="form-group">
      <label>Date of Birth</label>
      <input type="date" [(ngModel)]="form.dob" />
    </div>

    <div class="form-group">
      <label>Gender</label>
      <select [(ngModel)]="form.gender">
        <option value="">Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="form.email" placeholder="Email address" />
    </div>

    <div class="form-group">
      <label>Address</label>
      <input type="text" [(ngModel)]="form.address" placeholder="Home address" />
    </div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="form.username" placeholder="Choose a username" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="form.password" placeholder="Choose a password" />
    </div>

    @if (error()) {
    <p class="error">{{ error() }}</p>
    }

    <button class="btn-primary" (click)="onSubmit()" [disabled]="loading()">
      {{ loading() ? 'Registering...' : 'Register' }}
    </button>

    <p class="switch-link">
      Already have an account? <a routerLink="/login">Login</a>
    </p>
  </div>
</div>
