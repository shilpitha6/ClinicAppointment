<div class="page-container">
  <button class="btn-back" (click)="goBack()">← Back to Doctors</button>

  <h2>Available Slots</h2>


  @if (doctor(); as doctor) {
  <div class="doctor-summary">
    <p><strong>Dr. {{ doctor.first_name }} {{ doctor.last_name }}</strong></p>
    <span class="specialty-badge">{{ doctor.specialty.name }}</span>
  </div>
  }



  <div class="slot-grid">
    @for (slot of slots(); track slot.slot_id) {
    <div class="slot-card" (click)="selectSlot(slot)">
      <p class="slot-date">
        {{ slot.slot_date | date: ' MMMM d, y' }}
      </p>
      <p class="slot-time">
        {{ slot.start_time }} – {{ slot.end_time }}
      </p>
      <span class="available-tag">Available</span>
    </div>
    }
  </div>
</div>
