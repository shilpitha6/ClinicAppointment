<div class="auth-container">
  <div class="auth-card">
    <h2>Welcome Back</h2>

    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" placeholder="Enter username" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Enter password" />
    </div>

    @if (error()) {
    <p class="error">{{ error() }}</p>
    }

    <button class="btn-primary" (click)="onSubmit()" [disabled]="loading()">
      {{ loading() ? 'Logging in...' : 'Login' }}
    </button>

    <p class="switch-link">
      No account yet? <a routerLink="/register">Register</a>
    </p>
  </div>
</div>
