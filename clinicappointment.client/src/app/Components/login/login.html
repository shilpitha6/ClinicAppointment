<div class="auth-container">
  <div class="auth-card">
    <h2>Welcome Back</h2>

    @if (serverError()) {
    <div class="msg-error">{{ serverError() }}</div>
    }

    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="form.username" placeholder="Enter your username" />
      @if (errors.username) { <span class="field-error">{{ errors.username }}</span> }
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="form.password" placeholder="Enter your password" />
      @if (errors.password) { <span class="field-error">{{ errors.password }}</span> }
    </div>

    <button class="btn-primary" (click)="submit()" [disabled]="loading()">
      {{ loading() ? 'Logging in...' : 'Login' }}
    </button>

    <p class="auth-link">Don't have an account? <a routerLink="/register">Register</a></p>
  </div>
</div>
